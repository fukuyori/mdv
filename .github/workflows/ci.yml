name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The Qt version is the single source of truth in qt-default-version.txt;
# each job reads it so CI and the build scripts cannot drift apart.

env:
  QT_MODULES: qtwebengine qtwebchannel qtpositioning
  # Runners have no GPU and no user namespaces for Chromium's sandbox.
  MDV_WEBENGINE_TEST_CHROMIUM_FLAGS: --disable-gpu --no-sandbox

jobs:
  qt-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "version=$(tr -d '[:space:]' < qt-default-version.txt)" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (${{ matrix.name }})
    needs: qt-version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
            sanitize: "OFF"
          - name: ASan/UBSan
            build_type: Debug
            sanitize: "ON"
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1 libegl1 libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libnss3 libxkbcommon0 libxkbcommon-x11-0 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxcursor1 libxi6 libasound2t64 libxkbfile1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-cursor0
      - name: Install Qt ${{ needs.qt-version.outputs.version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ needs.qt-version.outputs.version }}
          modules: ${{ env.QT_MODULES }}
          cache: true
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DMDV_SANITIZE=${{ matrix.sanitize }} \
            -DMDV_WEBENGINE_TEST_CHROMIUM_FLAGS="${MDV_WEBENGINE_TEST_CHROMIUM_FLAGS}"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          # Qt and Chromium leave allocations alive at exit; leak reports
          # would drown the memory-error signal this job exists for.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
      - name: Version
        run: QT_QPA_PLATFORM=offscreen build/mdv --version

  macos:
    name: macOS
    needs: qt-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt ${{ needs.qt-version.outputs.version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ needs.qt-version.outputs.version }}
          modules: ${{ env.QT_MODULES }}
          cache: true
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMDV_WEBENGINE_TEST_CHROMIUM_FLAGS="${MDV_WEBENGINE_TEST_CHROMIUM_FLAGS}"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Version
        run: QT_QPA_PLATFORM=offscreen build/mdv.app/Contents/MacOS/mdv --version

  windows:
    name: Windows
    needs: qt-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt ${{ needs.qt-version.outputs.version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ needs.qt-version.outputs.version }}
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DMDV_WEBENGINE_TEST_CHROMIUM_FLAGS="$env:MDV_WEBENGINE_TEST_CHROMIUM_FLAGS"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        shell: pwsh
        run: |
          # Test executables need the Qt DLLs on PATH.
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          ctest --test-dir build --output-on-failure
      - name: Version
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          build\mdv.exe --version

  scripts:
    name: Shell and PowerShell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -x scripts/*.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $errors += $parseErrors }
          }
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
